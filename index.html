<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الألوان باللغة الإنجليزية للأطفال 🎨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #efebe9 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #3e2723;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 8px solid #ffb300;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* واجهات اللعبة */
        .screen {
            padding: 30px 20px;
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #d84315;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px #ffccbc;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #5d4037;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .main-img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            border: 4px solid #ffcc80;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* أزرار اللعبة */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(to bottom, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px #e65100, 0 10px 15px rgba(0,0,0,0.1);
            transition: 0.1s;
            margin: 5px;
        }

        .btn:active {
            box-shadow: 0 2px #e65100;
            transform: translateY(4px);
        }

        .btn-blue {
            background: linear-gradient(to bottom, #2196f3, #1976d2);
            box-shadow: 0 6px #0d47a1, 0 10px 15px rgba(0,0,0,0.1);
        }

        .btn-blue:active {
            box-shadow: 0 2px #0d47a1;
        }

        /* أقسام التعلم */
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .color-card {
            background: #efebe9;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 3px solid #d7ccc8;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-card:hover {
            transform: scale(1.05);
        }

        .color-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            border: 3px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .color-card span {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
        }

        /* قسم الاختبار التفاعلي */
        .quiz-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 20px;
            margin: 15px auto;
            border: 5px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: block;
        }

        .quiz-options-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .quiz-option {
            background: #fff;
            border: 4px solid #cfd8dc;
            border-radius: 20px;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            width: 150px;
            transition: all 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }

        .quiz-option:hover {
            border-color: #ffb300;
            transform: translateY(-3px);
        }

        .quiz-option span {
            font-size: 1.1rem;
            color: #78909c;
            display: block;
            margin-top: 5px;
        }

        .correct {
            background-color: #c8e6c9 !important;
            border-color: #4caf50 !important;
            color: #2e7d32 !important;
        }

        .incorrect {
            background-color: #ffcdd2 !important;
            border-color: #f44336 !important;
            color: #c62828 !important;
        }

        .feedback {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }

        .stars {
            font-size: 4rem;
            color: #ffca28;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .quiz-options-container { flex-direction: column; align-items: center; }
            .quiz-option { width: 80%; padding: 12px; }
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- شاشة البداية -->
    <div id="screen-start" class="screen active">
